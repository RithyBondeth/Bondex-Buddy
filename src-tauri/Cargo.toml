[package]
name = "tiny-desk-spirit"
version = "0.1.0"
description = "A quiet pixel-art desktop companion for macOS and Windows"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tiny_desk_spirit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-test = []

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri-plugin-autostart = "2.7"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12.6", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-clipboard-manager = "2"
dirs = "6"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = "2.1.1"
